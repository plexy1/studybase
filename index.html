<!doctype html>

<html lang="en" data-bs-theme="auto">
  <head>
    <script type="module" src="login.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Studybase login page">
    <title>studybase</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="index.css" rel="stylesheet">
  </head>

  <body>
    <div class="wrapper">
      <div class="login-container">
        <div class="dark-mode-toggle">
          <button id="darkModeToggle" class="dark-mode-btn" aria-label="Toggle dark mode">
            <i class="fas fa-moon dark-icon"></i>
            <i class="fas fa-sun light-icon"></i>
          </button>
        </div>
        
        <div class="login-card">
          <div class="login-header">
            <h1 class="logo">studybase</h1>
            <p class="subtitle">Sign in to your account</p>
          </div>
          
          <form id="loginForm">
            <div id="signInMessage" class="alert alert-danger" style="display: none;"></div>
            
            <div class="input-group">
              <div class="input-wrapper">
                <i class="fa-regular fa-envelope input-icon"></i>
                <div class="form-floating">
                  <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" maxlength="20">
                  <label for="floatingInput">Email address</label>
                </div>
              </div>
            </div>
            
            <div class="input-group">
              <div class="input-wrapper">
                <i class="fas fa-key input-icon"></i>
                <div class="form-floating">
                  <input type="password" class="form-control" id="floatingPassword" placeholder="Password" maxlength="20">
                  <label for="floatingPassword">Password</label>
                </div>
              </div>
            </div>
            
            <div class="form-options">
              <div class="remember-me">
                <input class="form-check-input" type="checkbox" id="flexCheckDefault" value="remember-me">
                <label class="form-check-label" for="flexCheckDefault">Remember me</label>
              </div>
              <a href="#" class="forgot-password">Forgot password?</a>
            </div>
            
            <button id="submit" type="submit" class="btn btn-primary login-btn">
              <i class="fas fa-sign-in-alt me-2"></i>Sign in
            </button>
            
            <div class="register-option">
              <span>Don't have an account?</span>
              <a href="create-account.html" class="register-link">Register</a>
            </div>
          </form>
        </div>
        
        <div class="service-status">
          <a href="status.html" class="status-link">
            <i class="fas fa-circle status-indicator"></i>
            All services operational
          </a>
        </div>
      </div>
    </div>
    
    <footer class="footer">
      <div class="container">
        <p class="mb-0">&copy; 2025 studybase | Group 7</p>
      </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Dark mode toggle functionality
      document.addEventListener('DOMContentLoaded', () => {
        const darkModeToggle = document.getElementById('darkModeToggle');
        const htmlElement = document.documentElement;
        
        // Check for saved theme preference or use preferred color scheme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          htmlElement.setAttribute('data-bs-theme', 'dark');
        }
        
        // Update icon based on current theme
        updateThemeIcon();
        
        darkModeToggle.addEventListener('click', () => {
          const currentTheme = htmlElement.getAttribute('data-bs-theme');
          const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
          
          htmlElement.setAttribute('data-bs-theme', newTheme);
          localStorage.setItem('theme', newTheme);
          
          // Update icon when theme changes
          updateThemeIcon();
        });
        
        function updateThemeIcon() {
          const currentTheme = htmlElement.getAttribute('data-bs-theme');
          const darkIcon = document.querySelector('.dark-icon');
          const lightIcon = document.querySelector('.light-icon');
          
          if (currentTheme === 'dark') {
            darkIcon.style.display = 'none';
            lightIcon.style.display = 'block';
          } else {
            darkIcon.style.display = 'block';
            lightIcon.style.display = 'none';
          }
        }
      });
    </script>
  </body>
</html>
