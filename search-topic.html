  <script>
    document.getElementById('searchBtn').addEventListener('click', function(event) {
      event.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      if (query) {
        searchYouTube(query);
        searchGoogle(query);
        searchGemini(query);

        let history = getCookie("searchHistory") ? JSON.parse(getCookie("searchHistory")) : [];
        if (!history.includes(query)) {
          history.push(query);
          setCookie("searchHistory", JSON.stringify(history), 30);
        }

        updateHistoryDisplay();
      }
    });

    function setCookie(name, value, days) {
      let expires = "";
      if (days) {
        let date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        expires = "; expires=" + date.toUTCString();
      }
      document.cookie = name + "=" + value + expires + "; path=/";
    }

    function getCookie(name) {
      let nameEQ = name + "=";
      let ca = document.cookie.split(';');
      for (let i = 0; i < ca.length; i++) {
        let c = ca[i];
        while (c.charAt(0) == ' ') c = c.substring(1, c.length);
        if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
      }
      return null;
    }

    function updateHistoryDisplay() {
      let history = getCookie("searchHistory") ? JSON.parse(getCookie("searchHistory")) : [];
      const historyContainer = document.getElementById('historyContainer');

      if (historyContainer) {
        historyContainer.innerHTML = '';
        history.forEach(topic => {
          const li = document.createElement('li');
          li.textContent = topic;
          historyContainer.appendChild(li);
        });
      }
    }

    document.addEventListener('DOMContentLoaded', updateHistoryDisplay);
  </script>

  <script src="youtube-search.js"></script>
  <script>
    const darkModeToggle = document.getElementById('darkModeToggle');
    const body = document.body;

    // Function to enable dark mode
    function enableDarkMode() {
      body.classList.add('dark-mode');
      darkModeToggle.checked = true;
      localStorage.setItem('darkMode', 'enabled');
    }

    // Function to disable dark mode
    function disableDarkMode() {
      body.classList.remove('dark-mode');
      darkModeToggle.checked = false;
      localStorage.setItem('darkMode', null);
    }

    // Function to toggle dark mode
    function toggleDarkMode() {
      if (body.classList.contains('dark-mode')) {
        disableDarkMode();
      } else {
        enableDarkMode();
      }
    }

    // Event listener for the dark mode toggle
    darkModeToggle.addEventListener('change', toggleDarkMode);

    // Check localStorage for dark mode preference on page load
    if (localStorage.getItem('darkMode') === 'enabled') {
      enableDarkMode();
    } else {
      disableDarkMode();
    }
  </script>
