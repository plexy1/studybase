  <script>
  document.getElementById('searchBtn').addEventListener('click', function() {
    const query = document.getElementById('searchInput').value.trim();
      if (query) {
        searchYouTube(query);
        searchGoogle(query);
  

        let history = getCookie("searchHistory") ? JSON.parse(getCookie("searchHistory")) : [];
        if (!history.includes(query)) {
        history.push(query);
        setCookie("searchHistory", JSON.stringify(history), 30); // Stores history for 30 days
        }
  
        updateHistoryDisplay();
      }
    });
    
  function setCookie(name, value, days) {
    let expires = "";
    if (days) {
    let date = new Date();
    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000)); // Convert days to milliseconds
    expires = "; expires=" + date.toUTCString();
    }
    document.cookie = name + "=" + value + expires + "; path=/";
  }

  function getCookie(name) {
  let nameEQ = name + "=";
  let ca = document.cookie.split(';');
  for (let i = 0; i < ca.length; i++) {
    let c = ca[i];
    while (c.charAt(0) == ' ') c = c.substring(1, c.length);
    if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
  }
  return null;
}
    //
  function updateHistoryDisplay() {
    let history = getCookie("searchHistory") ? JSON.parse(getCookie("searchHistory")) : [];
    const historyContainer = document.getElementById('historyContainer');

      if (historyContainer) {
        historyContainer.innerHTML = '';
        history.forEach(topic => {
          const li = document.createElement('li');
          li.textContent = topic;
          historyContainer.appendChild(li);
        });
      }
  }
  
  document.addEventListener('DOMContentLoaded', updateHistoryDisplay);
  </script>
  

  </script>
