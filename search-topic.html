<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search Topic</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    
    body {
      display: flex;
      flex-direction: column;
    }
    
    .container {
      flex: 1;
    }
    
    footer {
      margin-top: auto;
    }

    a.text-light {
      text-decoration: none;
    }
    a.text-light:hover {
      text-decoration: underline;
    }
    .profile-logo {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      object-fit: cover;
    }
    .search-box {
      max-width: 600px;
      margin: 0 auto;
    }
    #searchResult {
      margin-top: 20px;
    }
    .result-container {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
    }
    .left-half, .right-half {
      width: 48%;
    }
    .video-details {
      margin-top: 20px;
    }
    .video-details img {
      width: 100%;
      max-width: 400px;
    }
    .video-details p {
      margin: 10px 0;
    }
    .video-details h3 {
      text-align: left;
    }
    .video-details h3 a {
      font-size: 1.5rem;
    }
    .video-details .video-info {
      text-align: left;
    }
    .video-details .video-info p {
      margin: 5px 0;
      font-size: 0.85rem;
    }
    .video-details .description {
      margin-top: 10px;
      text-align: left;
    }
    .video-details .description p {
      font-size: 0.8rem;
      line-height: 1.2;
      margin: 5px 0;
    }
    #googleResults {
      text-align: left;
    }
    #googleResults .g-item {
      margin-bottom: 1rem;
    }
    #googleResults .g-item h4 {
      font-size: 1rem;
      margin: 0;
    }
    #googleResults .g-item a {
      color: #007bff;
      text-decoration: none;
    }
    #googleResults .g-item a:hover {
      text-decoration: underline;
    }
    #googleResults .snippet {
      font-size: 0.9rem;
      color: #555;
    }
    #videoSlider {
      gap: 1rem;
      white-space: nowrap;
      overflow-x: auto;
      scroll-behavior: smooth;
      width: 90%;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">studybase</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="search-topic.html">Search Topic</a></li>
          <li class="nav-item"><a class="nav-link" href="courses.html">Search Course</a></li>
          <li class="nav-item"><a class="nav-link" href="quiz.html">Generate Quiz</a></li>
          <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
          <li class="nav-item"><a class="nav-link" href="account.html">Account & Settings</a></li>
        </ul>
      </div>
      <img src="/assets/images/user.jpg" alt="Profile" class="profile-logo ms-auto"/>
    </div>
  </nav>

  <div class="container text-center mt-5">
    <div class="search-box mt-4">
      <input id="searchInput" type="text" class="form-control" placeholder="Search any topic or concept">
      <button id="searchBtn" type="button" class="btn btn-primary mt-2 w-100">Search</button>
    </div>
  </div>

  <footer class="bg-dark text-light py-3 mt-5">
    <div class="container d-flex justify-content-between align-items-center">
      <p class="mb-0">&copy; 2025 Group 7</p>
      <div>
        <a href="#" class="text-light me-3">Instagram</a>
        <a href="#" class="text-light me-3">Twitter</a>
        <a href="#" class="text-light">LinkedIn</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="google-search.js"></script>
  <script src="youtube-search.js"></script>
  <script>
    document.getElementById('searchBtn').addEventListener('click', (event) => {
      event.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      if (query) {
        searchYouTube(query);
        searchGoogle(query);
      }
    });
  </script>
</body>
</html>
