    <meta charset="utf-8">

  <body>
    <div class="wrapper">
      <div class="login-container">
        <div class="dark-mode-toggle">
          <button id="darkModeToggle" class="dark-mode-btn" aria-label="Toggle dark mode">
            <i class="fas fa-moon dark-icon"></i>
            <i class="fas fa-sun light-icon"></i>
          </button>
        </div>
        
        <div class="login-card">
          <div class="login-header">
            <h1 class="logo">studybase</h1>
            <p class="subtitle">Create a new account</p>
          </div>
          
          <form id="registerForm">
            <div id="successMessage" class="alert alert-success" style="display: none;"></div>
            
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="floatingUsername" placeholder="Username" required maxlength="20">
              <label for="floatingUsername">Username</label>
            </div>
            
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="floatingUniversity" placeholder="University Name" maxlength="20">
              <label for="floatingUniversity">University Name</label>
            </div>
            
            <div class="form-floating">
              <input type="email" class="form-control" id="floatingEmail" placeholder="name@example.com" required maxlength="20">
              <label for="floatingEmail">Email address</label>
            </div>
            
            <div class="form-floating mb-3">
              <input type="password" class="form-control" id="floatingPassword" placeholder="Password" required maxlength="20">
              <label for="floatingPassword">Password</label>
            </div>
            
            <button type="submit" class="btn btn-primary login-btn">
              <i class="fas fa-user-plus me-2"></i>Create Account
            </button>
            
            <div class="register-option">
              <span>Already have an account?</span>
              <a href="index.html" class="register-link">Sign in</a>
            </div>
          </form>
        </div>
        
        <div class="service-status">
          <a href="status.html" class="status-link">
            <i class="fas fa-circle status-indicator"></i>
            All services operational
          </a>
        </div>
      </div>
    </div>
    
    <footer class="footer">

      </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Dark mode toggle functionality
      document.addEventListener('DOMContentLoaded', () => {
        const darkModeToggle = document.getElementById('darkModeToggle');
        const htmlElement = document.documentElement;
        
        // Check for saved theme preference or use preferred color scheme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          htmlElement.setAttribute('data-bs-theme', 'dark');
        }
        
        // Update icon based on current theme
        updateThemeIcon();
        
        darkModeToggle.addEventListener('click', () => {
          const currentTheme = htmlElement.getAttribute('data-bs-theme');
          const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
          
          htmlElement.setAttribute('data-bs-theme', newTheme);
          localStorage.setItem('theme', newTheme);
          
          // Update icon when theme changes
          updateThemeIcon();
        });
        
        function updateThemeIcon() {
          const currentTheme = htmlElement.getAttribute('data-bs-theme');
          const darkIcon = document.querySelector('.dark-icon');
          const lightIcon = document.querySelector('.light-icon');
          
          if (currentTheme === 'dark') {
            darkIcon.style.display = 'none';
            lightIcon.style.display = 'block';
          } else {
            darkIcon.style.display = 'block';
            lightIcon.style.display = 'none';
          }
        }
      });
    </script>
  </body>
</html>
